[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labtool-cf"
version = "0.1.0"
description = "Manage a Cloudflare Tunnel for machines behind NAT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["cloudflare", "tunnel", "cloudflared", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = ["click>=8.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/afourteene/labtool"

[project.scripts]
labtool = "labtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]